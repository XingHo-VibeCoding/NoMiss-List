<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoMiss List</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f5;
      color: #2c2c2a;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e5e4df;
      border-radius: 16px;
      padding: 40px 44px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    .sub {
      font-size: 15px;
      color: #6b6b66;
      margin-bottom: 28px;
    }
    .checks {
      list-style: none;
      text-align: left;
      border-top: 1px solid #eeede9;
      border-bottom: 1px solid #eeede9;
      padding: 18px 0;
      margin-bottom: 24px;
    }
    .checks li {
      font-size: 14px;
      line-height: 2;
      color: #444441;
    }
    .checks span { color: #1d9e75; font-weight: 600; margin-right: 8px; }
    .foot {
      font-size: 13px;
      color: #96968f;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>NoMiss List</h1>
    <p class="sub">项目已初始化 · Day 2 占位页</p>
    <ul class="checks">
      <li><span>✓</span>Git 仓库已建立</li>
      <li><span>✓</span>Node.js 环境就绪</li>
      <li><span>✓</span>GitHub 账号已连通</li>
      <li><span>✓</span>忽略规则已生效</li>
    </ul>
    <p class="foot">网站功能将在 Day 7 开始开发</p>
  </div>
</body>
</html>
